name: Check app quality

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run qa
        env:
          QA_ALL_BROWSERS: "1"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-report
          path: |
            .qa
            test-results
            playwright-report
          if-no-files-found: ignore
